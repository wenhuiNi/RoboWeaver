[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roboweaver"
version = "0.1.0"
description = "A harness for embodied tasks with extensible atomic action streams"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["google-adk>=1.16,<2", "pydantic>=2,<3", "jsonschema>=4,<5", "aiosqlite>=0.21"]

[project.scripts]
roboweaver = "roboweaver.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "pytest-socket>=0.7,<1", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-socket --allow-unix-socket -m 'not live_api and not live_sim and not live_e2e' --junitxml=.local/test-results/pytest.xml"
asyncio_mode = "auto"
markers = ["smoke: quick offline entrypoint checks", "integration: cross-module behavior", "live_api: requires configured model API", "live_sim: requires simulator", "live_e2e: requires model and simulator"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
